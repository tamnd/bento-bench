name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Re-run weekly so runtime updates that shift performance surface on their own.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the harness and keep it healthy on its own terms.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: latest

  # The benchmark run itself: install every runtime, build bento from source,
  # and time the same workloads on all four.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # Pin concrete versions so a comparison across time moves only when we
      # deliberately bump one, not whenever a floating tag rolls forward.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Build bento
        # bento is measured through its ahead-of-time path, so the benchmark
        # compiles each workload with `bento build` and times the binary. Clone
        # bento at main and build it, rather than go install @main, so the run
        # uses the true latest commit instead of a proxy-cached older one, while
        # dependency checksums still verify through the proxy. BENTO_MODULE_ROOT
        # points the build's link step at this checkout, since it holds the value
        # runtime the generated Go imports and the binary lives outside it.
        if: ${{ !contains(vars.SKIP || '', 'bento') }}
        run: |
          git clone --depth 1 https://github.com/tamnd/bento.git "$RUNNER_TEMP/bento"
          ( cd "$RUNNER_TEMP/bento" && go build -o "$RUNNER_TEMP/bento-bin" ./cmd/bento )
          echo "BENTO_BIN=$RUNNER_TEMP/bento-bin" >> "$GITHUB_ENV"
          echo "BENTO_MODULE_ROOT=$RUNNER_TEMP/bento" >> "$GITHUB_ENV"

      - name: Versions
        run: |
          echo "node $(node --version)"
          echo "deno $(deno --version | head -1)"
          echo "bun  $(bun --version)"
          echo "bento ${BENTO_BIN:+$($BENTO_BIN --version || true)}"

      - name: Run benchmark
        # The workloads are a fixed size, so --budget caps the timed runs to keep
        # every runtime quick while the numbers stay comparable across runs. The
        # budget bounds the compile passes too, which matters now that bento, bun,
        # and deno each compile every workload to a binary before it is timed. Set
        # the RUNS, BUDGET, or SKIP repo variables to run heavier or to leave a
        # runtime out.
        run: |
          go run ./cmd/bento-bench \
            --runs "${{ vars.RUNS || '15' }}" \
            --warmup 1 \
            --budget "${{ vars.BUDGET || '5s' }}" \
            --skip "${{ vars.SKIP || '' }}" \
            --json results.json \
            --markdown results.md

      - name: Job summary
        if: always()
        run: cat results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results.json
            results.md
